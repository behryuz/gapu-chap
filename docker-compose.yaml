services:
  postgres:
    image: postgres:16-alpine
    container_name: gapu-chap-postgres
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Сервисы ниже стартуют только с профилем app: `make up` (или docker compose --profile app up).
  # Обычный `docker compose up -d` по-прежнему поднимает одну базу для локальной разработки.
  app:
    build: .
    container_name: gapu-chap-app
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-24h}
      MIGRATE_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../gapu-chap-front
    container_name: gapu-chap-web
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata: